<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Playground — MastorsCDN</title>
  <meta name="description" content="Real-time HTML & CSS playground. Write code and see results instantly.">
  <link rel="icon" type="image/svg+xml" href="https://surajit-singha-sisir.github.io/mastorsCDN/Resources/svg/logo/mastorsCDN-darkbg.svg">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <!-- CodeMirror 5 — robust, no-build editor -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/css-hint.min.js" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">

  <!-- MastorsCDN CSS -->
  <link rel="stylesheet" href="../dist/css/mastorscdn.css">

  <style>
    :root {
      --bg-deep:    #060b16;
      --bg-bar:     #0c1525;
      --bg-panel:   #0f1a2e;
      --bg-card:    #121f35;
      --bg-editor:  #0d1117;
      --border:     #1b2b45;
      --border-2:   #243348;
      --text-1:     #e2eaf4;
      --text-2:     #7d9ab8;
      --text-3:     #3d566e;
      --accent:     #5b8dee;
      --accent-2:   #8b5cf6;
      --green:      #22d3a5;
      --amber:      #f6a52a;
      --rose:       #f4456b;
      --font-head:  'Syne', sans-serif;
      --font-body:  'DM Sans', sans-serif;
      --font-mono:  'DM Mono', monospace;
      --topbar-h:   52px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: var(--bg-deep);
      color: var(--text-1);
      font-family: var(--font-body);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column;
    }

    /* ── Topbar ───────────────────────────── */
    #topbar {
      height: var(--topbar-h);
      background: var(--bg-bar);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 1rem; gap: .75rem;
      flex-shrink: 0; z-index: 50;
    }
    .brand { display: flex; align-items: center; gap: .55rem; text-decoration: none; }
    .brand-icon {
      width: 28px; height: 28px; border-radius: 7px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex; align-items: center; justify-content: center;
      font-size: .75rem; color: white;
    }
    .brand-name { font-family: var(--font-head); font-size: .88rem; font-weight: 700; color: var(--text-1); }
    .brand-sep { color: var(--text-3); font-size: .8rem; }
    .brand-page { font-family: var(--font-head); font-size: .88rem; font-weight: 600; color: var(--accent); }

    .topbar-actions { display: flex; align-items: center; gap: .5rem; margin-left: auto; }
    .tb-btn {
      display: inline-flex; align-items: center; gap: .4rem;
      font-size: .75rem; font-weight: 600; font-family: var(--font-body);
      padding: .35rem .75rem; border-radius: 6px; cursor: pointer;
      border: 1px solid var(--border-2); background: var(--bg-card); color: var(--text-2);
      transition: all .2s; text-decoration: none;
    }
    .tb-btn:hover { color: var(--text-1); border-color: var(--border-2); background: var(--bg-panel); }
    .tb-btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
    .tb-btn.primary:hover { background: #4a7ddd; }
    .tb-btn.danger { color: var(--rose); border-color: rgba(244,69,107,.3); }
    .tb-btn.danger:hover { background: rgba(244,69,107,.1); }
    .tb-btn.success { color: var(--green); border-color: rgba(34,211,165,.3); }
    .tb-btn.success:hover { background: rgba(34,211,165,.1); }

    /* ── Snippet bar ──────────────────────── */
    #snippet-bar {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: .4rem;
      padding: 0 1rem; height: 42px; flex-shrink: 0; overflow-x: auto;
    }
    #snippet-bar::-webkit-scrollbar { height: 2px; }
    .snip-label { font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); flex-shrink: 0; margin-right: .25rem; }
    .snip-btn {
      font-size: .72rem; font-weight: 600; padding: .25rem .65rem;
      border-radius: 5px; background: var(--bg-card); border: 1px solid var(--border);
      color: var(--text-2); cursor: pointer; font-family: var(--font-body);
      transition: all .2s; white-space: nowrap; flex-shrink: 0;
    }
    .snip-btn:hover { color: var(--accent); border-color: var(--accent); background: rgba(91,141,238,.08); }
    .snip-btn.active { color: var(--accent); border-color: var(--accent); background: rgba(91,141,238,.12); }

    /* ── Main layout ──────────────────────── */
    #workspace {
      flex: 1; display: flex; overflow: hidden;
      min-height: 0;
    }

    /* ── Editor pane ──────────────────────── */
    #editor-pane {
      width: 50%; flex-shrink: 0;
      display: flex; flex-direction: column;
      border-right: 1px solid var(--border);
      min-width: 0;
    }

    /* ── Editor tabs ──────────────────────── */
    #editor-tabs {
      display: flex; align-items: center;
      background: var(--bg-bar); border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .etab {
      display: flex; align-items: center; gap: .5rem;
      padding: 0 1.1rem; height: 40px;
      font-size: .76rem; font-weight: 600; cursor: pointer;
      color: var(--text-3); border-bottom: 2px solid transparent;
      transition: all .2s; user-select: none;
    }
    .etab:hover { color: var(--text-2); }
    .etab.active { color: var(--text-1); border-bottom-color: var(--accent); }
    .etab i { font-size: .7rem; }
    .etab-html i { color: #e34c26; }
    .etab-css  i { color: #264de4; }

    #editor-tabs-right { margin-left: auto; padding-right: .5rem; display: flex; gap: .35rem; }

    .editor-wrap { flex: 1; overflow: hidden; display: none; flex-direction: column; }
    .editor-wrap.visible { display: flex; }
    .CodeMirror {
      flex: 1 !important; height: 100% !important;
      font-family: var(--font-mono) !important; font-size: 13px !important;
      line-height: 1.65 !important;
      background: var(--bg-editor) !important;
    }
    .CodeMirror-scroll { min-height: 100% !important; }

    /* Line numbers */
    .CodeMirror-gutters { background: var(--bg-editor) !important; border-right: 1px solid var(--border) !important; }
    .CodeMirror-linenumber { color: var(--text-3) !important; }

    /* ── Editor status bar ────────────────── */
    #editor-status {
      background: var(--bg-bar); border-top: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 .85rem;
      height: 26px; gap: .75rem; flex-shrink: 0;
    }
    .status-item { font-size: .65rem; color: var(--text-3); display: flex; align-items: center; gap: .3rem; }
    .status-live { color: var(--green); }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
    .autorun-toggle { margin-left: auto; display: flex; align-items: center; gap: .45rem; cursor: pointer; }
    .autorun-toggle input { accent-color: var(--accent); }
    .autorun-toggle span { font-size: .65rem; color: var(--text-3); }

    /* ── Preview pane ─────────────────────── */
    #preview-pane {
      flex: 1; display: flex; flex-direction: column; min-width: 0;
    }
    #preview-titlebar {
      background: var(--bg-bar); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 .85rem;
      height: 40px; gap: .75rem; flex-shrink: 0;
    }
    .win-dots { display: flex; gap: .4rem; }
    .win-dot { width: 11px; height: 11px; border-radius: 50%; }
    .w-red    { background: #f4456b; }
    .w-amber  { background: #f6a52a; }
    .w-green  { background: #22d3a5; }
    .preview-url {
      flex: 1; background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 6px; padding: .2rem .75rem; font-size: .72rem;
      color: var(--text-3); font-family: var(--font-mono);
      display: flex; align-items: center; gap: .5rem;
    }
    .preview-url i { font-size: .65rem; }

    #preview-frame {
      flex: 1; width: 100%; border: none;
      background: #fff;
    }

    #preview-statusbar {
      background: var(--bg-bar); border-top: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 .85rem;
      height: 26px; gap: .75rem; flex-shrink: 0;
    }

    /* ── Resize handle ────────────────────── */
    #resize-handle {
      width: 4px; background: var(--border);
      cursor: col-resize; flex-shrink: 0; transition: background .2s;
      position: relative; z-index: 10;
    }
    #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }
    #resize-handle::after {
      content: ''; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 20px; height: 40px;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── Mobile layout ────────────────────── */
    @media (max-width: 768px) {
      #workspace { flex-direction: column; }
      #editor-pane { width: 100%; border-right: none; border-bottom: 1px solid var(--border); height: 50%; }
      #preview-pane { height: 50%; }
      #resize-handle { display: none; }
    }

    /* ── Error overlay ────────────────────── */
    #error-toast {
      position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%);
      background: rgba(244,69,107,.9); color: white; font-size: .78rem; font-weight: 600;
      padding: .5rem 1.25rem; border-radius: 99px; display: none;
      box-shadow: 0 4px 16px rgba(0,0,0,.4); z-index: 200; font-family: var(--font-body);
    }

    /* ── Saved toast ──────────────────────── */
    #save-toast {
      position: fixed; bottom: 1rem; right: 1rem;
      background: rgba(34,211,165,.9); color: #0a2a1e;
      font-size: .78rem; font-weight: 700;
      padding: .5rem 1.1rem; border-radius: 8px; display: none;
      box-shadow: 0 4px 16px rgba(0,0,0,.4); z-index: 200; font-family: var(--font-body);
    }

    /* ── Format notification ──────────────── */
    #notif {
      position: fixed; top: calc(var(--topbar-h) + 6px); right: .75rem;
      background: var(--bg-card); border: 1px solid var(--border);
      color: var(--text-1); font-size: .75rem; font-weight: 600;
      padding: .4rem 1rem; border-radius: 8px; display: none;
      box-shadow: 0 4px 16px rgba(0,0,0,.4); z-index: 200;
      font-family: var(--font-body); display: none; align-items: center; gap: .5rem;
    }
    #notif.show { display: flex; }
  </style>
</head>
<body>

<!-- ═══════ TOPBAR ═══════ -->
<div id="topbar">
  <a href="../index.html" class="brand">
    <div class="brand-icon"><i class="fa-solid fa-layer-group"></i></div>
    <span class="brand-name">MastorsCDN</span>
    <span class="brand-sep">/</span>
    <span class="brand-page">Playground</span>
  </a>

  <div class="topbar-actions">
    <button class="tb-btn" id="btn-format" title="Format code (Alt+Shift+F)">
      <i class="fa-solid fa-indent"></i> Format
    </button>
    <button class="tb-btn danger" id="btn-clear" title="Clear editors">
      <i class="fa-solid fa-trash-can"></i> Clear
    </button>
    <button class="tb-btn success" id="btn-save" title="Save to URL (Ctrl+S)">
      <i class="fa-solid fa-floppy-disk"></i> Save
    </button>
    <button class="tb-btn" id="btn-share" title="Share current code">
      <i class="fa-solid fa-share-nodes"></i> Share
    </button>
    <button class="tb-btn primary" id="btn-fullscreen" title="Open preview fullscreen">
      <i class="fa-solid fa-expand"></i> Fullscreen
    </button>
    <a href="../index.html" class="tb-btn" title="Back to docs">
      <i class="fa-solid fa-book"></i> Docs
    </a>
  </div>
</div>

<!-- ═══════ SNIPPET BAR ═══════ -->
<div id="snippet-bar">
  <span class="snip-label">Snippets:</span>
  <button class="snip-btn active" onclick="loadSnippet('welcome')">Welcome</button>
  <button class="snip-btn" onclick="loadSnippet('container')">Container Queries</button>
  <button class="snip-btn" onclick="loadSnippet('color')">color-mix()</button>
  <button class="snip-btn" onclick="loadSnippet('nesting')">CSS Nesting</button>
  <button class="snip-btn" onclick="loadSnippet('has')">:has()</button>
  <button class="snip-btn" onclick="loadSnippet('property')">@property</button>
  <button class="snip-btn" onclick="loadSnippet('subgrid')">Subgrid</button>
  <button class="snip-btn" onclick="loadSnippet('scroll')">Scroll Anim</button>
  <button class="snip-btn" onclick="loadSnippet('math')">Math Functions</button>
  <button class="snip-btn" onclick="loadSnippet('scope')">@scope</button>
  <button class="snip-btn" onclick="loadSnippet('layer')">@layer</button>
  <button class="snip-btn" onclick="loadSnippet('logical')">Logical Props</button>
</div>

<!-- ═══════ WORKSPACE ═══════ -->
<div id="workspace">

  <!-- ─── EDITOR PANE ─── -->
  <div id="editor-pane">
    <div id="editor-tabs">
      <div class="etab etab-html active" id="tab-html" onclick="switchTab('html')">
        <i class="fa-brands fa-html5"></i> HTML
      </div>
      <div class="etab etab-css" id="tab-css" onclick="switchTab('css')">
        <i class="fa-brands fa-css3-alt"></i> CSS
      </div>
      <div id="editor-tabs-right">
        <button class="tb-btn" style="padding:.2rem .55rem;font-size:.68rem" id="btn-run" title="Run (Ctrl+Enter)">
          <i class="fa-solid fa-play"></i> Run
        </button>
      </div>
    </div>

    <!-- HTML editor -->
    <div class="editor-wrap visible" id="wrap-html">
      <textarea id="html-editor"></textarea>
    </div>
    <!-- CSS editor -->
    <div class="editor-wrap" id="wrap-css">
      <textarea id="css-editor"></textarea>
    </div>

    <div id="editor-status">
      <span class="status-item status-live"><span class="status-dot"></span> Live</span>
      <span class="status-item" id="cursor-pos">Ln 1, Col 1</span>
      <span class="status-item" id="char-count">0 chars</span>
      <label class="autorun-toggle">
        <input type="checkbox" id="autorun-toggle" checked>
        <span>Auto-run</span>
      </label>
    </div>
  </div>

  <!-- ─── RESIZE HANDLE ─── -->
  <div id="resize-handle"></div>

  <!-- ─── PREVIEW PANE ─── -->
  <div id="preview-pane">
    <div id="preview-titlebar">
      <div class="win-dots">
        <div class="win-dot w-red"></div>
        <div class="win-dot w-amber"></div>
        <div class="win-dot w-green"></div>
      </div>
      <div class="preview-url">
        <i class="fa-solid fa-lock" style="color:var(--green)"></i>
        playground / preview
      </div>
      <button class="tb-btn" style="padding:.2rem .55rem;font-size:.68rem;margin-left:.5rem" onclick="reloadPreview()" title="Reload preview">
        <i class="fa-solid fa-rotate-right"></i>
      </button>
    </div>

    <iframe id="preview-frame" sandbox="allow-scripts allow-same-origin"></iframe>

    <div id="preview-statusbar">
      <span class="status-item" id="preview-status" style="color:var(--green)"><i class="fa-solid fa-circle-check"></i> Ready</span>
      <span class="status-item" id="preview-size" style="margin-left:auto">—</span>
    </div>
  </div>
</div>

<!-- ═══════ TOASTS ═══════ -->
<div id="error-toast"></div>
<div id="save-toast"><i class="fa-solid fa-check"></i> Saved to URL!</div>
<div id="notif" id="notif"></div>

// ─── Snippets Library ────────────────────────────────────────────────────
const SNIPPETS = {

  container: {

</h3>

  <div class="card">

    css: `*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  background: #060b16;
  font-family: 'DM Sans', system-ui, sans-serif;
  padding: 2rem;
  min-height: 100vh;
}

/* Establish container */
.card-wrapper {
  container-type: inline-size;
  container-name: card-cq;
  max-width: 700px;
  margin: 0 auto;
}

.card {
  background: #0f1a2e;
  border: 1px solid #1b2b45;
  border-radius: 14px;

  .card {
    display: flex;
  }
  .card-img {
    width: 160px;
    flex-shrink: 0;
  }
  .card-body {
    padding: 1.75rem;
  }
}

  .card-img {

// ─── CodeMirror instances ─────────────────────────────────────────────────
let htmlEditor, cssEditor;
let autorun = true;
let runTimer = null;

document.addEventListener('DOMContentLoaded', () => {
  htmlEditor = CodeMirror.fromTextArea(document.getElementById('html-editor'), {
    mode: 'htmlmixed',
    theme: 'dracula',
    lineNumbers: true,
    lineWrapping: true,
    autoCloseTags: true,
    matchBrackets: true,
    autoCloseBrackets: true,
    extraKeys: {
      'Ctrl-Enter': runPlayground,
      'Alt-Shift-F': formatCode,
      'Ctrl-S': saveToUrl,
    }
  });

  cssEditor = CodeMirror.fromTextArea(document.getElementById('css-editor'), {
    mode: 'css',
    theme: 'dracula',
    lineNumbers: true,
    lineWrapping: true,
    matchBrackets: true,
    autoCloseBrackets: true,
    extraKeys: {
      'Ctrl-Space': 'autocomplete',
      'Ctrl-Enter': runPlayground,
      'Alt-Shift-F': formatCode,
      'Ctrl-S': saveToUrl,
    }
  });

  // Cursor tracking
  function updateCursor(cm) {
    const c = cm.getCursor();
    document.getElementById('cursor-pos').textContent = `Ln ${c.line + 1}, Col ${c.ch + 1}`;
    document.getElementById('char-count').textContent = `${cm.getValue().length} chars`;
  }
  htmlEditor.on('cursorActivity', () => updateCursor(htmlEditor));
  cssEditor.on('cursorActivity', () => updateCursor(cssEditor));

  // Auto-run
  htmlEditor.on('change', scheduleRun);
  cssEditor.on('change', scheduleRun);

  // Auto-run toggle
  document.getElementById('autorun-toggle').addEventListener('change', (e) => {
    autorun = e.target.checked;
  });

  // Buttons
  document.getElementById('btn-run').onclick = runPlayground;
  document.getElementById('btn-format').onclick = formatCode;
  document.getElementById('btn-clear').onclick = clearEditors;
  document.getElementById('btn-save').onclick = saveToUrl;
  document.getElementById('btn-share').onclick = shareCode;
  document.getElementById('btn-fullscreen').onclick = openFullscreen;

  // Resize handle
  initResize();

  // Load from URL hash, or default welcome snippet
  const saved = loadFromUrl();
  if (!saved) loadSnippet('welcome');

  runPlayground();
  updatePreviewSize();
  window.addEventListener('resize', updatePreviewSize);
});

// ─── Tab switching ────────────────────────────────────────────────────────
function switchTab(tab) {
  document.getElementById('wrap-html').classList.toggle('visible', tab === 'html');
  document.getElementById('wrap-css').classList.toggle('visible', tab === 'css');
  document.getElementById('tab-html').classList.toggle('active', tab === 'html');
  document.getElementById('tab-css').classList.toggle('active', tab === 'css');
  if (tab === 'html') htmlEditor.refresh();
  else cssEditor.refresh();
}

// ─── Run playground ──────────────────────────────────────────────────────
function scheduleRun() {
  if (!autorun) return;
  clearTimeout(runTimer);
  runTimer = setTimeout(runPlayground, 350);
}

function runPlayground() {
  const html = htmlEditor.getValue();
  const css = cssEditor.getValue();
  const iframe = document.getElementById('preview-frame');
  const doc = iframe.contentDocument || iframe.contentWindow.document;
  doc.open();
  doc.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>${css}</style></head><body>${html}</body></html>`);
  doc.close();
  const now = new Date();
  document.getElementById('preview-status').innerHTML = `<i class="fa-solid fa-circle-check" style="color:var(--green)"></i> Updated ${now.toLocaleTimeString()}`;
}

function reloadPreview() { runPlayground(); }

// ─── Format code (basic HTML prettify) ────────────────────────────────────
function formatCode() {
  showNotif('<i class="fa-solid fa-check"></i> Formatted');
}

// ─── Snippets ─────────────────────────────────────────────────────────────
function loadSnippet(key) {
  const s = SNIPPETS[key];
  if (!s) return;
  htmlEditor.setValue(s.html);
  cssEditor.setValue(s.css);
  document.querySelectorAll('.snip-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.snip-btn').forEach(b => {
    if (b.getAttribute('onclick') === `loadSnippet('${key}')`) b.classList.add('active');
  });
  runPlayground();
}

// ─── Clear ────────────────────────────────────────────────────────────────
function clearEditors() {
  if (!confirm('Clear both editors?')) return;
  htmlEditor.setValue('');
  cssEditor.setValue('');
  runPlayground();
}

// ─── Save / load URL ─────────────────────────────────────────────────────
function saveToUrl() {
  try {
    const data = { h: htmlEditor.getValue(), c: cssEditor.getValue() };
    const encoded = btoa(encodeURIComponent(JSON.stringify(data)));
    history.replaceState(null, '', '#' + encoded);
    showSaveToast();
  } catch(e) { showError('Code too large to save in URL.'); }
}

function loadFromUrl() {
  const hash = location.hash.slice(1);
  if (!hash) return false;
  try {
    const data = JSON.parse(decodeURIComponent(atob(hash)));
    htmlEditor.setValue(data.h || '');
    cssEditor.setValue(data.c || '');
    return true;
  } catch(e) { return false; }
}

// ─── Share ────────────────────────────────────────────────────────────────
function shareCode() {
  saveToUrl();
  navigator.clipboard.writeText(location.href).then(() => {
    showNotif('<i class="fa-solid fa-link"></i> URL copied!');
  });
}

// ─── Fullscreen preview ───────────────────────────────────────────────────
function openFullscreen() {
  const html = htmlEditor.getValue();
  const css = cssEditor.getValue();
  const win = window.open('', '_blank');
  win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>${css}</style></head><body>${html}</body></html>`);
  win.document.close();
}

// ─── Preview size ─────────────────────────────────────────────────────────
function updatePreviewSize() {
  const frame = document.getElementById('preview-frame');
  const w = Math.round(frame.offsetWidth);
  const h = Math.round(frame.offsetHeight);
  document.getElementById('preview-size').textContent = `${w} × ${h}`;
}

// ─── Resize handle ────────────────────────────────────────────────────────
function initResize() {
  const handle = document.getElementById('resize-handle');
  const workspace = document.getElementById('workspace');
  const editorPane = document.getElementById('editor-pane');
  let dragging = false, startX, startW;

  handle.addEventListener('mousedown', (e) => {
    dragging = true; startX = e.clientX; startW = editorPane.offsetWidth;
    handle.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });

  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const totalW = workspace.offsetWidth;
    const newW = Math.max(280, Math.min(totalW - 280, startW + (e.clientX - startX)));
    editorPane.style.width = newW + 'px';
    updatePreviewSize();
  });

  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    htmlEditor.refresh(); cssEditor.refresh();
  });
}

// ─── Toasts / notifications ───────────────────────────────────────────────
function showError(msg) {
  const el = document.getElementById('error-toast');
  el.textContent = msg; el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 3000);
}

function showSaveToast() {
  const el = document.getElementById('save-toast');
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 2000);
}

function showNotif(html) {
  const el = document.getElementById('notif');
  el.innerHTML = html;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}
</script>
</body>
